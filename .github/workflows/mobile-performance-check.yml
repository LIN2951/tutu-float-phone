name: Mobile performance build check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "components/desktop-shell.tsx"
      - "components/chat/phone-chat-app.tsx"
      - "components/ui/session-custom-css.tsx"
      - "vite.mobile.config.mjs"
      - "mobile/**"
      - "android/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/mobile-performance-check.yml"

permissions:
  contents: read

jobs:
  mobile-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build Android web bundle
        run: npm run android:web

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build Android debug APK
        working-directory: android
        run: bash ./gradlew :app:assembleDebug --no-daemon

      - name: Upload debug APK for validation
        uses: actions/upload-artifact@v4
        with:
          name: float-android-debug-validation
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
